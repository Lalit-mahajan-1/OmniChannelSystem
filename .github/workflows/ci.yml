name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  lint-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "18"
          cache: "npm"
          cache-dependency-path: Backend/package-lock.json
      - name: Install dependencies
        working-directory: ./Backend
        run: npm ci
      - name: Lint
        working-directory: ./Backend
        run: npm run lint || echo "Lint script not configured"

  test-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "18"
          cache: "npm"
          cache-dependency-path: Backend/package-lock.json
      - name: Install dependencies
        working-directory: ./Backend
        run: npm ci
      - name: Run tests
        working-directory: ./Backend
        run: npm test || echo "Tests not configured"

  lint-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "18"
          cache: "npm"
          cache-dependency-path: Frontend/package-lock.json
      - name: Install dependencies
        working-directory: ./Frontend
        run: npm ci
      - name: Lint
        working-directory: ./Frontend
        run: npm run lint || echo "Lint script not configured"
      - name: Type check
        working-directory: ./Frontend
        run: npm run typecheck || echo "Typecheck script not configured"

  build-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "18"
          cache: "npm"
          cache-dependency-path: Frontend/package-lock.json
      - name: Install dependencies
        working-directory: ./Frontend
        run: npm ci
      - name: Build
        working-directory: ./Frontend
        run: npm run build

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Build Backend Docker
        run: docker build -t omnichannel-backend:test ./Backend
      - name: Build Frontend Docker
        run: docker build -t omnichannel-frontend:test ./Frontend
      - name: Build ML Service Docker
        run: docker build -t omnichannel-ml-service:test ./ml-service
